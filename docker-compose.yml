services:
  sentinel:
    build: .
    container_name: sentinel
    volumes:
      # Projects directory — READ ONLY
      - ${PROJECTS_DIR:-/home/user/projects}:/projects:ro
      # Report persistence
      - ./reports:/reports
      # CVE database persistence (osv-scanner, grype)
      - ./data:/data
      # IOC lists — read-write for auto-update feeds
      - ./scanner/iocs:/sentinel/iocs
    # Host UID/GID for writing reports and data
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - SCAN_DEPTH=${SCAN_DEPTH:-4}
      - REPORT_FORMAT=${REPORT_FORMAT:-md}
      - SEVERITY_MIN=${SEVERITY_MIN:-medium}
      - EXCLUDE_DIRS=${EXCLUDE_DIRS:-}
      - REPORT_LANG=${REPORT_LANG:-en}
      - IOC_AUTO_UPDATE=${IOC_AUTO_UPDATE:-true}
      - SKIP_SECRETS=${SKIP_SECRETS:-false}
      - SECRETS_MODE=${SECRETS_MODE:-verified}
      - SECRETS_MAX_DEPTH=${SECRETS_MAX_DEPTH:-}
      - SECRETS_SINCE_COMMIT=${SECRETS_SINCE_COMMIT:-}
      - SECRETS_TIMEOUT=${SECRETS_TIMEOUT:-300}
    # CLI tool — no web exposure, no Traefik
    # Network access needed only for CVE database updates
    networks:
      - default
    # Container security hardening
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
